<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marmara Koleji | Fen Lisesi — Vector Explorer</title>
<style>
:root{--navy:#0b2a4a;--navy2:#143d6b;--teal:#12b5b0;--teal-d:#0b8f8b;--bg:#f3f8fa;--line:#d3e4ea;--ink:#12303f;--mut:#5b7685;--ok:#1b9e5a;--bad:#d64045}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
#app{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
#app:fullscreen{overflow:auto}
header.top{background:#fff;border-bottom:4px solid var(--teal);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:10px 20px}
.school{font-size:13px;letter-spacing:.14em;font-weight:700;color:var(--teal-d)}
header h1{margin:2px 0 0;font-size:28px;color:var(--navy);letter-spacing:.03em}
.sub{color:var(--mut);font-weight:600}
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.langs{display:flex;border:2px solid var(--navy);border-radius:10px;overflow:hidden}
.langs button{border:0;background:#fff;color:var(--navy);font-size:16px;font-weight:700;padding:10px 16px;cursor:pointer;min-height:44px}
.langs button.on{background:var(--navy);color:#fff}
nav#tabs{display:flex;gap:6px;padding:10px 20px 0;overflow-x:auto;background:#e6f1f4;border-bottom:1px solid var(--line)}
nav#tabs button{border:0;background:#fff;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:12px 16px;font-size:15px;font-weight:700;color:var(--navy2);cursor:pointer;white-space:nowrap;min-height:46px}
nav#tabs button .n{display:inline-block;background:var(--teal);color:#fff;border-radius:50%;width:22px;height:22px;line-height:22px;text-align:center;font-size:12px;margin-right:6px}
nav#tabs button.on{background:var(--navy);color:#fff}
main#main{padding:16px 20px 30px;flex:1}
.mhead{margin:0 0 12px}
.mhead h2{margin:0;color:var(--navy);font-size:22px}
.mhead p{margin:4px 0 0;color:var(--mut)}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.wscol{min-width:0}
.wsbox{background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(11,42,74,.07)}
svg.ws{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.side{background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.side h3{margin:0;font-size:16px;color:var(--navy)}
.btn{font:inherit;font-size:15px;font-weight:700;padding:10px 14px;min-height:44px;border-radius:10px;border:2px solid var(--navy2);background:#fff;color:var(--navy2);cursor:pointer;touch-action:manipulation}
.btn:hover{background:#eaf4f7}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--teal);border-color:var(--teal-d);color:#fff}
.btn.pri:hover{background:var(--teal-d)}
.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.tog{border-color:var(--line);color:var(--mut);font-weight:600}
.btn.tog.on{background:#dff5f4;border-color:var(--teal);color:var(--teal-d)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.task{background:#eef8f8;border-left:5px solid var(--teal);padding:10px 12px;border-radius:8px;font-weight:600}
.task .big{font-size:20px;color:var(--navy)}
.fb{border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.45;display:none}
.fb div{margin:3px 0}
.fb.ok{display:block;background:#e7f7ee;border:1px solid #9fdcb8}
.fb.bad{display:block;background:#fff1f1;border:1px solid #f1b0b3}
.fb.info{display:block;background:#eef4fb;border:1px solid #b9d0ec}
.fb .ok{color:var(--ok);font-weight:900}.fb .bad{color:var(--bad);font-weight:900}.fb .inf{color:#2a64b0}
.info-box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;min-height:40px;line-height:1.5}
select,input[type=text],input[type=number],textarea{font:inherit;font-size:15px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;width:100%;min-height:42px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
label.chk{display:flex;align-items:center;gap:8px;font-weight:600;min-height:36px}
label.chk input{width:22px;height:22px}
input[type=range]{width:100%;height:32px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #9ab;cursor:pointer}
.sw button.on{box-shadow:0 0 0 3px var(--navy)}
.seg{display:flex;border:2px solid var(--navy2);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;font:inherit;font-weight:700;padding:10px;cursor:pointer;color:var(--navy2);min-height:44px}
.seg button.on{background:var(--navy2);color:#fff}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600;background:#fff;margin:6px 0}
.opt.on{border-color:var(--teal);background:#e8f8f7}
.opt input{margin-top:3px;width:20px;height:20px}
.prog{height:14px;background:#e1ecf0;border-radius:8px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--teal);transition:width .3s}
.steps{display:flex;gap:6px;margin-bottom:8px}
.steps span{flex:1;text-align:center;padding:6px;border-radius:8px;background:#e6f1f4;color:var(--mut);font-size:13px;font-weight:700}
.steps span.on{background:var(--navy);color:#fff}.steps span.done{background:#cdeee9;color:var(--teal-d)}
.sub-tabs{display:flex;gap:6px;margin-bottom:10px}
.glossary{width:100%;border-collapse:collapse;font-size:15px}
.glossary td,.glossary th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.glossary th{background:#eef6f8;color:var(--navy)}
.modal-bg{position:fixed;inset:0;background:rgba(11,42,74,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.modal h2{margin:0 0 10px;color:var(--navy)}
.concept{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}
.concept b{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#e1ecf0;color:#9ab;flex:none}
.concept.got b{background:var(--ok);color:#fff}.concept.got{font-weight:700}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:30px;font-weight:700;opacity:0;transition:.35s;z-index:99;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.mut{color:var(--mut);font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left}
.chal{display:flex;justify-content:space-between;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:4px 0}
.credit{text-align:center;padding:14px;color:var(--mut);font-size:14px;border-top:1px solid var(--line);background:#fff}
@media (max-width:1050px){.lab{grid-template-columns:1fr}.side{order:2}}
@media (max-width:600px){main#main{padding:10px}header.top{padding:8px 10px}header h1{font-size:21px}.btn{font-size:14px;padding:8px 10px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <div class="school">MARMARA KOLEJİ | FEN LİSESİ</div>
      <h1 id="title"></h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="hdr-r">
      <button class="btn" id="btn-gloss" type="button"></button>
      <button class="btn dark" id="btn-sum" type="button"></button>
      <div class="langs">
        <button id="btn-tr" type="button">🇹🇷 Türkçe</button>
        <button id="btn-en" type="button">🇬🇧 English</button>
      </div>
    </div>
  </header>
  <nav id="tabs"></nav>
  <main id="main"></main>
  <footer class="credit" id="credit"></footer>
</div>
<script src="core.js"></script>
<script src="modules.js"></script>
<script src="modules2.js"></script>
</body>
</html>
